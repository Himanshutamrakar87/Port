<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="faceGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f8c9a3" />
      <stop offset="70%" stop-color="#df9d72" />
      <stop offset="100%" stop-color="#c57d54" />
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="300" cy="300" r="290" fill="#f8fafc" />
  <circle cx="300" cy="300" r="280" fill="url(#bgGlow)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="300" cy="300" r="260" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6" fill="none" />

  <!-- Shoulders & Blazer Suit -->
  <path d="M 120 580 C 130 450 180 390 240 370 L 300 440 L 360 370 C 420 390 470 450 480 580 Z" fill="url(#suitGrad)" />
  
  <!-- Crisp White Shirt Collar -->
  <polygon points="260,370 300,435 275,410" fill="#f1f5f9" />
  <polygon points="340,370 300,435 325,410" fill="#f8fafc" />
  <polygon points="275,410 300,450 325,410 300,380" fill="#ffffff" />
  
  <!-- Gray Silk Tie -->
  <polygon points="293,420 307,420 312,530 300,555 288,530" fill="#475569" />
  <polygon points="292,410 308,410 304,422 296,422" fill="#334155" />

  <!-- Neck -->
  <rect x="270" y="320" width="60" height="70" rx="8" fill="#d9956d" />

  <!-- Head Base -->
  <ellipse cx="300" cy="250" rx="90" ry="110" fill="url(#faceGrad)" />

  <!-- Professional Parted Hair -->
  <path d="M 210 240 C 205 180 230 130 300 130 C 370 130 395 180 390 240 C 375 160 340 150 300 155 C 250 160 220 190 210 240 Z" fill="url(#hairGrad)" />
  <path d="M 215 220 C 210 160 270 135 340 140 C 310 145 250 160 235 210 Z" fill="#2d2d2d" />

  <!-- Ears -->
  <ellipse cx="208" cy="255" rx="12" ry="22" fill="#d9956d" />
  <ellipse cx="392" cy="255" rx="12" ry="22" fill="#d9956d" />

  <!-- Eyebrows -->
  <path d="M 245 220 Q 265 212 285 220" stroke="#18181b" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 315 220 Q 335 212 355 220" stroke="#18181b" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Eyes with Sparkle -->
  <ellipse cx="265" cy="235" rx="12" ry="8" fill="#ffffff" />
  <circle cx="265" cy="235" r="5.5" fill="#1c1917" />
  <circle cx="263" cy="233" r="1.5" fill="#ffffff" />

  <ellipse cx="335" cy="235" rx="12" ry="8" fill="#ffffff" />
  <circle cx="335" cy="235" r="5.5" fill="#1c1917" />
  <circle cx="333" cy="233" r="1.5" fill="#ffffff" />

  <!-- Nose -->
  <path d="M 300 230 L 297 265 Q 300 270 305 268" stroke="#b46a42" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Confident Smile -->
  <path d="M 278 290 Q 300 308 322 290" stroke="#994d29" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 283 291 Q 300 300 317 291" fill="#ffffff" />

  <!-- Subtle Designer Glasses (Light Frame) -->
  <rect x="242" y="222" width="46" height="28" rx="6" stroke="#4b5563" stroke-width="2.5" fill="none" opacity="0.85" />
  <rect x="312" y="222" width="46" height="28" rx="6" stroke="#4b5563" stroke-width="2.5" fill="none" opacity="0.85" />
  <line x1="288" y1="234" x2="312" y2="234" stroke="#4b5563" stroke-width="2.5" opacity="0.85" />
</svg>
